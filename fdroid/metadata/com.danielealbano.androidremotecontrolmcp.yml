Summary: Drive your phone with AI agents over MCP (FOSS build)
Description: |
  Runs a Model Context Protocol (MCP) server on the device so AI agents can
  inspect the screen, operate apps and automate tasks through the Android
  accessibility API. No root and no ADB are required; the server is reachable
  over the local network or through an optional tunnel.
  .
  This is the FOSS build: it contains no Google Mobile Services dependencies
  and no proprietary libraries.
